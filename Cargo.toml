[package]
name = "sevens"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
lazy_static = "1.5.1"
numformat = { git = "https://github.com/andywarduk/numformat.git" }
tokio = { version = "1.53.2", features = ["full"] }
futures = "0.3.34"
colored = "3"
terminal_size = "0.4.4"
simple-process-stats = "2.0.0"

[profile.release]
debug = true
lto = true

[features]
trace = []
nostats = []
